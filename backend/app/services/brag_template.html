<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #000; }
  body { font-family: 'Segoe UI', 'Nirmala UI', system-ui, -apple-system, 'Noto Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }
  .display { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-track); line-height: 1.0; }
  .style-bold { --display: 'Bahnschrift', 'Arial Narrow', 'Segoe UI', sans-serif; --display-weight: 700; --display-track: -0.01em; }
  .style-bold .display { font-stretch: 78%; text-transform: uppercase; }
  .style-modern { --display: 'Segoe UI', system-ui, sans-serif; --display-weight: 800; --display-track: -0.035em; }
  .style-elegant { --display: Georgia, Cambria, 'Times New Roman', serif; --display-weight: 700; --display-track: -0.015em; }
  .style-friendly { --display: 'Trebuchet MS', 'Segoe UI', sans-serif; --display-weight: 700; --display-track: -0.02em; }
  .cover { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .noart { background: radial-gradient(120% 80% at 80% 10%, color-mix(in srgb, var(--accent) 55%, var(--bg)), var(--bg) 70%); }
  .caps { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; }
  .pill { display: inline-flex; align-items: center; gap: 0.35em; border-radius: 999px; white-space: nowrap; }

  /* ───────────── poster (1080 × 1350) ───────────── */
  .poster .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 38%, rgba(0,0,0,.86) 78%, rgba(0,0,0,.94) 100%); }
  .poster .biz { position: absolute; left: 60px; top: 60px; max-width: 620px; padding: 16px 28px; background: rgba(10,10,10,.62); color: #fff; font-size: 32px; overflow: hidden; text-overflow: ellipsis; }
  .poster .badge { position: absolute; right: 56px; top: 56px; width: 340px; height: 340px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-9deg); box-shadow: 0 24px 60px rgba(0,0,0,.45); text-align: center; }
  .poster .badge::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; border: 3px dashed color-mix(in srgb, var(--accent-ink) 55%, transparent); }
  .poster .badge .big { white-space: nowrap; font-size: 150px; }
  .poster .badge .small { font-size: 50px; margin-top: 4px; }
  .poster .badge .pre { font-size: 30px; margin-bottom: 6px; }
  .poster .body { position: absolute; left: 64px; right: 64px; bottom: 60px; color: #fff; }
  .poster .kicker { color: var(--accent); font-size: 32px; margin-bottom: 18px; }
  .poster .headline { font-size: 136px; text-wrap: balance; overflow-wrap: anywhere; }
  .poster .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
  .poster .chip { padding: 14px 26px; border: 2.5px solid rgba(255,255,255,.85); font-size: 36px; font-weight: 600; white-space: normal; }
  .poster .chip.solid { background: #fff; color: #111; border-color: #fff; }
  .poster .chip i { font-style: normal; opacity: .72; font-weight: 500; }
  .poster .cta { margin-top: 30px; padding: 20px 38px; background: var(--accent); color: var(--accent-ink); font-size: 38px; font-weight: 800; }
  /* block layout: a solid panel carries the text */
  .poster.layout-block .scrim { background: linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,0) 24%); }
  .poster.layout-block .panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); clip-path: polygon(0 70px, 100% 0, 100% 100%, 0 100%); }
  .poster.layout-block .body { color: var(--ink); }
  .poster.layout-block .chip { border-color: color-mix(in srgb, var(--ink) 80%, transparent); }
  .poster.layout-block .chip.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ───────────── video (720 × 1280) ───────────── */
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .scene .pad { position: absolute; left: 56px; right: 56px; }
  #wipe { position: absolute; inset: -4px; background: var(--accent); transform: translateY(101%); z-index: 20; }
  .v-biz { position: absolute; left: 56px; top: 64px; padding: 12px 22px; font-size: 24px; background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
  .blob { position: absolute; border-radius: 50%; }
  #s-hook .hook { top: 0; bottom: 0; display: flex; align-items: center; }
  #s-hook .hook h1 { font-size: 104px; }
  #s-hook .hook h1 span { display: inline-block; white-space: pre; }
  #s-hook .bar { position: absolute; left: 56px; bottom: 300px; height: 12px; width: 220px; background: var(--accent); transform-origin: left center; border-radius: 6px; }
  #s-reveal .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.88) 86%); }
  #s-reveal .pad { bottom: 120px; color: #fff; }
  #s-reveal .kick { color: var(--accent); font-size: 30px; margin-bottom: 16px; }
  #s-reveal h2 { font-size: 118px; text-wrap: balance; overflow-wrap: anywhere; }
  #s-offer { background: var(--accent); color: var(--accent-ink); }
  #s-offer .pad { top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #s-offer .pre { font-size: 44px; margin-bottom: 10px; }
  #s-offer .huge { font-size: 330px; white-space: nowrap; line-height: .9; }
  #s-offer .off { font-size: 120px; margin-top: 8px; }
  #s-offer .on { font-size: 50px; font-weight: 700; margin-top: 28px; max-width: 100%; text-wrap: balance; }
  #s-offer .on i { font-style: normal; opacity: .7; font-weight: 500; }
  #s-offer .cap { margin-top: 44px; padding: 14px 28px; font-size: 28px; background: var(--accent-ink); color: var(--accent); }
  #s-offer .ring { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; border: 3px dashed color-mix(in srgb, var(--accent-ink) 30%, transparent); }
  #s-when .pad { top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  #s-when .cap { color: var(--accent); font-size: 30px; margin-bottom: 24px; }
  #s-when h2 { font-size: 112px; text-wrap: balance; overflow-wrap: anywhere; }
  #s-when .win { align-self: flex-start; margin-top: 34px; padding: 18px 34px; background: var(--accent); color: var(--accent-ink); font-size: 60px; font-weight: 800; }
  #s-when .extra { margin-top: 30px; font-size: 40px; font-weight: 600; }
  #s-when .extra i { font-style: normal; opacity: .65; font-weight: 500; }
  #s-outro .dim { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(10px) brightness(.34); }
  #s-outro .pad { top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; color: #fff; }
  #s-outro.plain .pad { color: var(--ink); }
  #s-outro h2 { font-size: 92px; text-wrap: balance; overflow-wrap: anywhere; }
  #s-outro .head { margin-top: 26px; font-size: 54px; color: var(--accent); text-wrap: balance; }
  #s-outro .cta { align-self: flex-start; margin-top: 54px; padding: 22px 40px; background: var(--accent); color: var(--accent-ink); font-size: 40px; font-weight: 800; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = __SPEC__;
const F = S.facts;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Every string drawn is tagged with what it is, so the server can record
// exactly what was rendered: FACT = a locked token value, verbatim.
const fact = (name, cls = '') => `<span class="${cls}" data-key="FACT" data-token="${name}">${esc(F[name])}</span>`;
const copy = (text, cls = '', tag = 'span') => `<${tag} class="${cls}" data-key="COPY">${esc(text)}</${tag}>`;
const stage = document.getElementById('stage');
stage.style.width = S.W + 'px'; stage.style.height = S.H + 'px';
stage.className = 'style-' + S.style;
for (const [k, v] of Object.entries({ '--bg': S.bg, '--ink': S.ink, '--accent': S.accent, '--accent-ink': S.accentInk })) stage.style.setProperty(k, v);
const art = S.art ? `style="background-image:url(${S.art})"` : '';

/** Shrink text until it fits its height budget (and, for one-liners, its width). */
function fit(el, min, maxH, maxW) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (size > min && (el.scrollHeight > maxH || el.scrollWidth > (maxW || el.clientWidth + 1))) { size -= Math.max(2, size * 0.04); el.style.fontSize = size + 'px'; }
}

function offerBadge(bigCls, smallCls, preCls) {
  if (F.DISCOUNT) {
    // "25%" reads as "25% OFF"; a flat discount token already ends in "off".
    return fact('DISCOUNT', bigCls + ' display fit-one') + (S.discountNeedsOff ? copy('OFF', smallCls + ' display') : '');
  }
  if (F.PRICE) return copy('Now at', preCls + ' caps') + fact('PRICE', bigCls + ' display fit-one');
  return '';
}

function buildPoster() {
  const p = S.poster;
  const badge = offerBadge('big', 'small', 'pre');
  const chips = [
    F.DAYS ? `<span class="pill chip solid">${fact('DAYS')}</span>` : '',
    F.WINDOW ? `<span class="pill chip solid">${fact('WINDOW')}</span>` : '',
    F.AUDIENCE ? `<span class="pill chip"><i data-key="COPY">For</i>${fact('AUDIENCE')}</span>` : '',
    F.LOCATION ? `<span class="pill chip"><i data-key="COPY">At</i>${fact('LOCATION')}</span>` : '',
    F.CONDITIONS ? `<span class="pill chip">${fact('CONDITIONS')}</span>` : '',
  ].join('');
  stage.classList.add('poster', 'layout-' + p.layout);
  stage.innerHTML = `
    <div class="cover ${S.art ? '' : 'noart'}" ${art}></div><div class="scrim"></div>
    ${p.layout === 'block' ? '<div class="panel"></div>' : ''}
    <div class="pill biz caps" data-key="BUSINESS">${esc(S.business)}</div>
    ${badge ? `<div class="badge">${badge}</div>` : ''}
    <div class="body">
      ${copy(p.kicker, 'kicker caps', 'div')}
      <h1 class="headline display" data-key="HEADLINE">${esc(S.headline)}</h1>
      <div class="chips">${chips}</div>
      ${copy(p.cta + ' →', 'pill cta', 'div')}
    </div>`;
  fit(stage.querySelector('.headline'), 62, 400);
  const big = stage.querySelector('.badge .big'); if (big) fit(big, 54, 200, 280);
  if (p.layout === 'block') {
    const body = stage.querySelector('.body');
    stage.querySelector('.panel').style.height = body.offsetHeight + 60 + 110 + 'px';
    const b = stage.querySelector('.badge'); if (b) b.style.top = (S.H - body.offsetHeight - 60 - 110 - 250) + 'px';
  }
}

// ───────────── video ─────────────
const clamp = (x) => Math.min(1, Math.max(0, x));
const oc = (x) => 1 - Math.pow(1 - x, 3);
const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ob = (x) => { const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let scenes = [];

function buildVideo() {
  const v = S.video;
  const biz = `<div class="pill v-biz caps" data-key="BUSINESS" data-a="0.1">${esc(S.business)}</div>`;
  const hookWords = v.hook.split(/\s+/).map((w, i, a) => `<span data-a="${(0.12 + i * 0.09).toFixed(2)}" data-m="rise">${esc(w)}${i < a.length - 1 ? ' ' : ''}</span>`).join('');
  const html = {
    hook: `<div class="blob" id="b1" style="width:520px;height:520px;right:-190px;top:-150px;background:var(--accent)"></div>
      <div class="blob" id="b2" style="width:340px;height:340px;left:-130px;bottom:-90px;border:10px solid var(--accent)"></div>
      ${biz}<div class="pad hook"><h1 class="display" data-key="COPY" data-text="${esc(v.hook)}">${hookWords}</h1></div><div class="bar" id="hookbar"></div>`,
    reveal: `<div class="cover kb ${S.art ? '' : 'noart'}" ${art}></div><div class="shade"></div>
      <div class="pad">${copy(v.reveal_kicker, 'kick caps', 'div').replace('data-key', 'data-a="0.15" data-key')}
      <h2 class="display" data-a="0.3">${fact('PRODUCT')}</h2></div>`,
    offer: `<div class="ring" id="ring"></div><div class="pad">
      ${F.DISCOUNT ? `<div data-a="0.1" data-m="pop">${fact('DISCOUNT', 'huge display')}</div>${S.discountNeedsOff ? `<div data-a="0.35" data-m="pop">${copy('OFF', 'off display')}</div>` : ''}`
        : F.PRICE ? `<div data-a="0.05">${copy('Now at', 'pre caps')}</div><div data-a="0.2" data-m="pop">${fact('PRICE', 'huge display')}</div>`
        : `<h2 class="display" style="font-size:110px" data-key="HEADLINE" data-a="0.1">${esc(S.headline)}</h2>`}
      ${F.DISCOUNT || F.PRICE ? `<div class="on" data-a="0.6"><i data-key="COPY">on</i> ${fact('PRODUCT')}</div>` : ''}
      <div class="pill cap caps" data-a="0.95" data-key="COPY">${esc(v.offer_caption)}</div></div>`,
    when: `${biz}<div class="pad">
      <div class="cap caps" data-a="0.1" data-key="COPY">${esc(v.when_caption)}</div>
      ${F.DAYS ? `<h2 class="display" data-a="0.25">${fact('DAYS')}</h2>` : ''}
      ${F.WINDOW ? `<div class="pill win" data-a="0.55" data-m="pop">${fact('WINDOW')}</div>` : ''}
      ${F.AUDIENCE ? `<div class="extra" data-a="0.85"><i data-key="COPY">For</i> ${fact('AUDIENCE')}</div>` : ''}
      ${F.LOCATION ? `<div class="extra" data-a="1.0"><i data-key="COPY">At</i> ${fact('LOCATION')}</div>` : ''}</div>`,
    outro: `${S.art ? `<div class="dim" ${art}></div>` : ''}<div class="pad">
      <h2 class="display" data-a="0.1" data-key="BUSINESS">${esc(S.business)}</h2>
      <div class="head display" data-a="0.35" data-key="HEADLINE">${esc(S.headline)}</div>
      <div class="pill cta" data-a="0.7" data-m="pop" data-key="COPY">${esc(v.cta)} →</div></div>`,
  };
  let at = 0;
  stage.innerHTML = v.timeline.map(([name]) => `<div class="scene ${name === 'outro' && !S.art ? 'plain' : ''}" id="s-${name}">${html[name]}</div>`).join('') + '<div id="wipe"></div>';
  scenes = v.timeline.map(([name, dur]) => { const sc = { name, start: at, dur, el: document.getElementById('s-' + name) }; at += dur; return sc; });
  for (const sc of scenes) sc.anim = [...sc.el.querySelectorAll('[data-a]')].map((el) => ({ el, delay: parseFloat(el.dataset.a), m: el.dataset.m || S.motion }));
  // Fitting needs layout, so every scene is measured once while visible.
  const fits = [['#s-hook h1', 54, 640], ['#s-reveal h2', 54, 330], ['#s-when h2', 50, 380], ['#s-outro h2', 44, 300], ['#s-outro .head', 30, 240], ['#s-offer .on', 26, 190]];
  for (const [sel, min, maxH] of fits) { const el = stage.querySelector(sel); if (el) fit(el, min, maxH); }
  const huge = stage.querySelector('#s-offer .huge'); if (huge) fit(huge, 90, 320, 600);
  window.DURATION = at;
}

function render(t) {
  if (S.mode !== 'video') return;
  for (const sc of scenes) {
    const lt = t - sc.start, on = lt >= 0 && lt < sc.dur + 0.001 || (sc === scenes[scenes.length - 1] && lt >= 0);
    sc.el.style.visibility = on ? 'visible' : 'hidden';
    if (!on) continue;
    for (const a of sc.anim) {
      const q = clamp((lt - a.delay) / 0.5);
      a.el.style.opacity = clamp(q * 2.2);
      a.el.style.transform = a.m === 'pop' ? `scale(${q <= 0 ? 0.55 : 0.55 + 0.45 * ob(q)})`
        : a.m === 'slide' ? `translateX(${-70 * (1 - oc(q))}px)` : `translateY(${46 * (1 - oc(q))}px)`;
    }
    const k = sc.el.querySelector('.kb'); if (k) k.style.transform = `scale(${1.04 + 0.1 * (lt / sc.dur)}) translateY(${-1.5 * (lt / sc.dur)}%)`;
    if (sc.name === 'hook') {
      document.getElementById('b1').style.transform = `translate(${14 * Math.sin(t * 1.3)}px, ${18 * Math.cos(t * 1.1)}px) scale(${oc(clamp(lt / 0.6))})`;
      document.getElementById('b2').style.transform = `translate(${12 * Math.cos(t * 1.2)}px, ${10 * Math.sin(t * 1.5)}px) scale(${oc(clamp((lt - 0.15) / 0.6))})`;
      document.getElementById('hookbar').style.transform = `scaleX(${io(clamp((lt - 0.7) / 0.7))})`;
    }
    if (sc.name === 'offer') document.getElementById('ring').style.transform = `rotate(${lt * 14}deg) scale(${0.9 + 0.1 * oc(clamp(lt / 0.8))})`;
  }
  // Accent wipe across every cut: fully covering at the cut itself.
  let y = 101;
  for (const sc of scenes.slice(1)) { const d = t - sc.start; if (d > -0.24 && d < 0.3) y = d < 0 ? 101 * (1 - io(clamp((d + 0.24) / 0.24))) : -101 * io(clamp(d / 0.3)); }
  document.getElementById('wipe').style.transform = `translateY(${y}%)`;
}

if (S.mode === 'poster') buildPoster(); else buildVideo();
window.rendered = () => [...stage.querySelectorAll('[data-key]')].map((el) => ({ key: el.dataset.key, text: (el.dataset.text || el.textContent).replace(/\s+/g, ' ').trim(), token: el.dataset.token || null }));
const images = S.art ? [new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = S.art; })] : [];
window.ready = Promise.all([document.fonts.ready, ...images]).then(() => { render(0); return true; });
</script>
</body>
</html>
